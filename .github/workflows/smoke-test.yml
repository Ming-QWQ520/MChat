name: Launch Smoke Test

# 启动冒烟测试：在 GitHub 托管 runner 的 KVM 模拟器上安装并冷启动 APK，
# 验证「进入 App 不闪退」。debug 与 release 产物各测一遍，任一崩溃即失败，
# 并把 logcat / crash buffer 作为 artifact 上传，供定位堆栈。
# 触发方式：手动 workflow_dispatch，或被其他 workflow 以 workflow_call 复用。

on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    name: Launch test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build debug & release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --console=plain

      - name: Launch test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -no-snapshot-save
          disable-animations: true
          # 注意：该 action 逐行执行 script（每行独立 sh -c），多行 if/函数/变量会失效，
          # 因此全部逻辑集中在 smoke_launch_check.sh 中单行调用。
          script: bash .github/scripts/smoke_launch_check.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-api${{ matrix.api-level }}
          path: |
            am-start-*.log
            logcat-*.log
            crash-buffer-*.log
          if-no-files-found: ignore
          retention-days: 14
